<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colección | NICOLETA FILIP ART</title>

    <meta
        name="description"
        content="Colección de obras originales de Nicoleta Filip Art. Relieve, textura, volumen y color en una selección de obras creadas a mano."
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ==================================================
     CABECERA
     ================================================== -->

<header class="cabecera">

    <div class="cabecera-contenedor">

        <a href="index.html" class="logotipo">

            <img
                src="imagenes/iconos/logo-nicoleta-filip.png"
                alt="Nicoleta Filip Art - Museo Digital Oficial">

        </a>


        <nav class="menu-navegacion">

            <a href="index.html">
                Inicio
            </a>

            <a href="galeria.html">
                Colección
            </a>

            <a href="artista.html">
                La artista
            </a>

            <a href="tecnicas.html">
                Técnicas
            </a>

            <a href="blog.html">
                Blog
            </a>

            <a href="contacto.html">
                Contacto
            </a>

        </nav>

    </div>

</header>


<!-- ==================================================
     INTRODUCCIÓN
     ================================================== -->

<main>

<section class="galeria-introduccion">

    <p class="etiqueta">
        NICOLETA FILIP ART
    </p>

    <h1>
        La colección
    </h1>

    <p>
        Obras originales creadas en relieve,
        donde la materia, la luz y la textura
        construyen una experiencia única.
    </p>

</section>


<!-- ==================================================
     FILTROS
     ================================================== -->

<section class="galeria">

    <div class="galeria-cabecera">

        <p class="etiqueta">
            OBRAS
        </p>

        <h2>
            Colección
        </h2>

    </div>


    <div class="galeria-filtros" aria-label="Filtrar colección">

    <button
        type="button"
        class="filtro-activo"
        data-filtro="todas">
        Todas
    </button>

    <button
        type="button"
        data-filtro="floral">
        Floral
    </button>

    <button
        type="button"
        data-filtro="botanica">
        Botánica
    </button>

    <button
        type="button"
        data-filtro="paisaje-y-escenas">
        Paisaje y escenas
    </button>

    <button
        type="button"
        data-filtro="fauna">
        Fauna
    </button>

    <button
        type="button"
        data-filtro="objetos-y-simbolos">
        Objetos y símbolos
    </button>

    <button
        type="button"
        data-filtro="composiciones-mixtas">
        Composiciones mixtas
    </button>

</div>


    <!-- ==================================================
         OBRAS
         ================================================== -->

    <div class="galeria-grid" id="galeria-obras">

    <!-- Las obras se generan desde datos/catalogo.json -->

</div>

</section>

</main>


<!-- ==================================================
     FOOTER
     ================================================== -->

<footer>

    <p>
        © 2026 NICOLETA FILIP ART · MUSEO DIGITAL OFICIAL
    </p>

</footer>


<!-- ==================================================
     FILTROS DE COLECCIÓN
     ================================================== -->

<script>

document.addEventListener("DOMContentLoaded", async function () {

    const contenedor = document.getElementById("galeria-obras");
    const filtros = document.querySelectorAll("[data-filtro]");

    let obras = [];


    /* ==================================================
       CARGAR CATÁLOGO
       ================================================== */

    try {

        const respuesta = await fetch("./datos/catalogo.json");

if (!respuesta.ok) {
    throw new Error(
        "HTTP " + respuesta.status +
        " — " + respuesta.statusText
    );
}

const catalogo = await respuesta.json();

if (!catalogo.obras || !Array.isArray(catalogo.obras)) {
    throw new Error(
        "El catálogo no contiene un array 'obras'."
    );
}

obras = catalogo.obras;

generarGaleria(obras);

        if (!respuesta.ok) {
            throw new Error("No se pudo cargar el catálogo.");
        }

        const catalogo = await respuesta.json();

        obras = catalogo.obras;

        generarGaleria(obras);

    } catch (error) {

        console.error("Error cargando catalogo.json:", error);

        contenedor.innerHTML = `
            <p class="galeria-error">
                No se ha podido cargar la colección.
            </p>
        `;

    }


    /* ==================================================
       GENERAR TARJETAS
       ================================================== */

    function generarGaleria(lista) {

        contenedor.innerHTML = "";

        lista.forEach(function (obra) {

            const articulo = document.createElement("article");

            articulo.className = "obra-card";

            articulo.dataset.categoria = normalizarCategoria(
                obra.categoria
            );


            const enlaceImagen = document.createElement("a");

            enlaceImagen.href = obra.ficha;


            /*
             * ARMONÍA tiene actualmente imagen publicada.
             * Las demás muestran placeholder hasta subir
             * sus fotografías.
             */

            if (obra.estado === "publicada") {

                enlaceImagen.innerHTML = `
                    <img
                        src="${obra.imagen}"
                        alt="${obra.titulo} - Obra original de Nicoleta Filip Art">
                `;

            } else {

                enlaceImagen.innerHTML = `
                    <div class="obra-card-placeholder">
                        ${obra.titulo}
                    </div>
                `;

            }


            const informacion = document.createElement("div");

            informacion.className = "obra-card-info";

            informacion.innerHTML = `

                <p class="obra-card-titulo">
                    ${obra.titulo}
                </p>

                ${
                    obra.dimensiones
                    ? `<p class="obra-card-datos">
                         ${obra.dimensiones}
                       </p>`
                    : ""
                }

                <a
                    href="${obra.ficha}"
                    class="enlace">
                    VER OBRA →
                </a>

            `;


            articulo.appendChild(enlaceImagen);

            articulo.appendChild(informacion);

            contenedor.appendChild(articulo);

        });

    }


    /* ==================================================
       FILTROS
       ================================================== */

    filtros.forEach(function (filtro) {

        filtro.addEventListener("click", function () {

            const categoria = this.dataset.filtro;


            filtros.forEach(function (boton) {

                boton.classList.remove("filtro-activo");

            });


            this.classList.add("filtro-activo");


            if (categoria === "todas") {

                generarGaleria(obras);

                return;

            }


            const filtradas = obras.filter(function (obra) {

                return normalizarCategoria(
                    obra.categoria
                ) === categoria;

            });


            generarGaleria(filtradas);

        });

    });


    /* ==================================================
       NORMALIZAR CATEGORÍAS
       ================================================== */

    function normalizarCategoria(categoria) {

        return categoria
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+y\s+/g, "-")
            .replace(/\s+/g, "-");

    }

});

</script>
